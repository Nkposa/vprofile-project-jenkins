apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.rabbitmq.name }}
  labels:
    app: {{ .Values.rabbitmq.name }}
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.rabbitmq.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.rabbitmq.name }}
    spec:
      containers:
      - name: {{ .Values.rabbitmq.name }}
        image: {{ .Values.rabbitmq.image }}
        imagePullPolicy: {{ .Values.rabbitmq.imagePullPolicy }}
        ports:
        - name: vpromq01-port
          containerPort: {{ .Values.rabbitmq.port }}
        env:
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rabbitmq.secret.name }}
              key: {{ .Values.rabbitmq.secret.key }}
        - name: RABBITMQ_DEFAULT_USER
          value: guest
        - name: RABBITMQ_ERLANG_COOKIE
          value: "CXOPIERNKWNBJISNGBKPOI"
