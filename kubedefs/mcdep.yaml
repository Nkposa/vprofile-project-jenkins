apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromc
  labels:
    app: vprodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpromc
  template:
    metadata:
      labels:
        app: vpromc
    spec:
      containers:
      - name: vpromc
        image: memcached:latest
        ports:
        - name: vpro-mc-port
          containerPort: 11211