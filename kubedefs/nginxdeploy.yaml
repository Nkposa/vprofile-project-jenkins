apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproginx
  labels:
    app: vproginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproginx
  template:
    metadata:
      labels:
        app: vproginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - name: nginx-port
          containerPort: 80
