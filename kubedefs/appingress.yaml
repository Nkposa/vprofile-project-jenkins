apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpro-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: vprofile.posafoods.online
    http:
      paths:
      - path: /naveen
        pathType: Prefix
        backend:
          service:
            name: vpronginx
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vproapp-service
            port:
              number: 8080
  - host: hima.posafoods.online
    http:
      paths:
      - path: /naveen
        pathType: Prefix
        backend:
          service:
            name: vpronginx
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vproapp-service
            port:
              number: 8080            