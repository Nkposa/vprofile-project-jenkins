# GitHub Actions Example 5: Matrix Strategy
# Test across multiple Java versions and OS platforms

name: Multi-Version Matrix Build

on:
  push:
    branches: [ main, local ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        java: ['17', '21']
      fail-fast: false  # Continue even if one combination fails
    
    name: Build on ${{ matrix.os }} with Java ${{ matrix.java }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean compile

    - name: Install without Tests
      run: mvn install -DskipTests
      
    - name: Upload War File
      uses: actions/upload-artifact@v4
      with:
        name: vprofile-v2-war-${{ matrix.os }}-java${{ matrix.java }}  
        path: target/*.war
        retention-days: 7  
    
    - name: Run Tests
      run: mvn test
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-java${{ matrix.java }}
        path: target/surefire-reports/
        retention-days: 7

   
    
    - name: Display Matrix Info
      run: |
        echo "OS: ${{ matrix.os }}"
        echo "Java Version: ${{ matrix.java }}"
        echo "Build Status: Success"
