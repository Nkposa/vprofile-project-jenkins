name: Setup Maven and Java and run tests
on: 
    push:
        branches: 
            - main
            - docker
            - local
    pull_request:
        branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              java-version: '21'
              distribution: 'temurin'
              cache: maven

          - name: Build with Maven
            run: mvn clean compile

          - name: Run Tests with Maven
            run: mvn test 
            
          - name: mvn install
            run: mvn install -DskipTests
            
            
          - name: Display war file
            run: ls -l target/*.war  

          - name: Artifact Upload
            uses: actions/upload-artifact@v3
            with:
              name: vprofile-v2-war
              path: target/*.war